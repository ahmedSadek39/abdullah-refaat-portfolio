<section class="about">
  <div class="about-container">
    <div class="avatar">
      <img [src]="avatarPath" alt="Engineer Avatar" />
    </div>
    <div class="info">
      <h2>{{ name }} | {{jobTitle}}</h2>
      <p>{{ bio }}</p>
      <div class="actions">
        <a [href]="linkedinUrl" target="_blank" class="social-icon linkedin" aria-label="LinkedIn Profile">
          <i class="fab fa-linkedin-in"></i>
        </a>
        <a class="action-btn" [href]="'mailto:' + email">Contact Me</a>
        <!-- <button class="action-btn" (click)="downloadCV()">Download CV</button> -->
      </div>
    </div>
  </div>
</section>
